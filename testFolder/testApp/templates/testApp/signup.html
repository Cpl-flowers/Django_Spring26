<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up | Study Room Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center">

    <section class="w-full max-w-md rounded-2xl bg-white p-8 shadow-lg text-center">

        <div class="rounded-2xl bg-orange-500 px-7 py-4 text-3xl font-bold tracking-wide text-white shadow-md inline-block mb-6">
            UTRGV
        </div>

        <h2 class="text-2xl font-bold text-green-800 mb-2">Access Restricted</h2>

        <p class="text-gray-600 mb-6">
            This system is only available to UTRGV students, staff, and faculty.
            Accounts are created by your university administrator.
        </p>

        <a href="{% url 'login' %}"
           class="w-full block rounded-xl bg-orange-500 px-4 py-3 font-semibold text-white hover:bg-orange-600">
            Go to Login
        </a>

    </section>

</body>
</html>
