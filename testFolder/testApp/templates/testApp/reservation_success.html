<!DOCTYPE html>
<html>
<head>
    <title>Reservation Success</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">

<div class="bg-white p-8 rounded-xl shadow text-center max-w-md w-full">

    <!-- Success Icon -->
    <div class="text-6xl mb-4">🎉</div>

    <h1 class="text-3xl font-bold text-green-700 mb-2">
        Reservation Confirmed!
    </h1>

    <p class="text-gray-500 mb-6">
        Your study room has been successfully reserved.
    </p>

    <div class="bg-gray-50 rounded-xl p-4 mb-6 text-left">
        <p class="text-gray-700 mb-2">
            <span class="font-semibold text-green-700">Room:</span> {{ room.number }}
        </p>
        <p class="text-gray-700 mb-2">
            <span class="font-semibold text-green-700">Building:</span> {{ room.building.name }}
        </p>
        <p class="text-gray-700 mb-2">
            <span class="font-semibold text-green-700">Date:</span> {{ date }}
        </p>
        <p class="text-gray-700 mb-2">
            <span class="font-semibold text-green-700">Start:</span> {{ start }}:00
        </p>
        <p class="text-gray-700 mb-2">
            <span class="font-semibold text-green-700">End:</span> {{ end }}:00
        </p>
        <p class="text-gray-700">
            <span class="font-semibold text-green-700">Duration:</span> {{ duration }} hour{{ duration|pluralize }}
        </p>
    </div>

    <div class="flex gap-3 justify-center">
        <a href="{% url 'my_reservations' %}"
           class="bg-green-500 text-white px-6 py-2 rounded-lg hover:bg-green-600 font-medium">
            My Reservations
        </a>
        <a href="{% url 'home' %}"
           class="bg-orange-500 text-white px-6 py-2 rounded-lg hover:bg-orange-600 font-medium">
            Back Home
        </a>
    </div>

</div>

</body>
</html>
